<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="create-app-flow-title create-app-flow-desc" id="create-app-flow-root">
        <title id="create-app-flow-title">What create-app does</title>
        <desc id="create-app-flow-desc">agentic-core runs five steps on its own (preflight, fill the template, validate render.yaml, create the GitHub repo, print the result), then you apply the Render Blueprint, which is the first step that costs money, set the Google settings, and sign in.</desc>
        <defs>
      <style>#create-app-flow-root { --color-paper:   #fafafa;
      --color-ink:     #18181b;
      --color-muted:   #52525b;
      --color-accent:  #4f46e5;
      --font-title:    'Urbanist', system-ui, sans-serif;
      --font-sans:     'Figtree', system-ui, sans-serif;
      --font-mono:     ui-monospace, SFMono-Regular, Menlo, monospace; }
      #create-app-flow-root { font-family: var(--font-sans); color: var(--color-ink); }
      #create-app-flow-root .diagram-container { width: 100%; overflow-x: auto; }
      @media print {
#create-app-flow-root .diagram-container { overflow-x: visible; }
}</style>
          <marker id="create-app-flow-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#52525b"/></marker>
          <marker id="create-app-flow-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f46e5"/></marker>
          <marker id="create-app-flow-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2563eb"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#fafafa"/>

        <!-- Lane structure -->
        <line x1="40" y1="64" x2="920" y2="64" stroke="#18181b" stroke-width="1" stroke-opacity="0.22"/>
        <line x1="40" y1="576" x2="920" y2="576" stroke="#18181b" stroke-width="1" stroke-opacity="0.22"/>
        <line x1="480" y1="24" x2="480" y2="576" stroke="#18181b" stroke-width="1" stroke-opacity="0.12"/>

        <!-- Lane labels -->
        <text x="60" y="36" fill="#52525b" font-size="8" font-weight="500" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" letter-spacing="0.18em">AGENTIC-CORE</text>
        <text x="60" y="52" fill="#6b6b76" font-size="9" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">runs automatically</text>
        <text x="500" y="36" fill="#52525b" font-size="8" font-weight="500" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" letter-spacing="0.18em">YOU</text>
        <text x="500" y="52" fill="#6b6b76" font-size="9" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">manual steps</text>

        <!-- Arrows first (behind boxes) -->
        <line x1="260" y1="128" x2="260" y2="152" stroke="#52525b" stroke-width="1.2" marker-end="url(#create-app-flow-arrow)"/>
        <line x1="260" y1="200" x2="260" y2="224" stroke="#52525b" stroke-width="1.2" marker-end="url(#create-app-flow-arrow)"/>
        <line x1="260" y1="272" x2="260" y2="296" stroke="#52525b" stroke-width="1.2" marker-end="url(#create-app-flow-arrow)"/>
        <line x1="260" y1="344" x2="260" y2="368" stroke="#52525b" stroke-width="1.2" marker-end="url(#create-app-flow-arrow)"/>
        <!-- Handoff: Print the result -> Apply the Blueprint -->
        <line x1="400" y1="392" x2="560" y2="392" stroke="#52525b" stroke-width="1.2" marker-end="url(#create-app-flow-arrow)"/>
        <line x1="700" y1="416" x2="700" y2="440" stroke="#52525b" stroke-width="1.2" marker-end="url(#create-app-flow-arrow)"/>
        <line x1="700" y1="488" x2="700" y2="512" stroke="#52525b" stroke-width="1.2" marker-end="url(#create-app-flow-arrow)"/>

        <!-- Arrow label -->
        <rect x="452" y="372" width="56" height="12" rx="2" fill="#fafafa"/>
        <text x="480" y="381" fill="#6b6b76" font-size="8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle" letter-spacing="0.06em">YOUR TURN</text>

        <!-- Step 1: Preflight -->
        <rect x="120" y="80" width="280" height="48" rx="6" fill="#fafafa"/>
        <rect x="120" y="80" width="280" height="48" rx="6" fill="#ffffff" stroke="#18181b" stroke-width="1"/>
        <rect x="132" y="96" width="16" height="16" rx="2" fill="none" stroke="#18181b" stroke-width="0.8" stroke-opacity="0.40"/>
        <text x="140" y="107" fill="#52525b" font-size="8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">1</text>
        <text x="160" y="101" fill="#18181b" font-size="12" font-weight="600" font-family="'Figtree', system-ui, sans-serif">Preflight</text>
        <text x="160" y="116" fill="#52525b" font-size="9" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">checks gh and render logins</text>

        <!-- Step 2: Fill the template -->
        <rect x="120" y="152" width="280" height="48" rx="6" fill="#fafafa"/>
        <rect x="120" y="152" width="280" height="48" rx="6" fill="#ffffff" stroke="#18181b" stroke-width="1"/>
        <rect x="132" y="168" width="16" height="16" rx="2" fill="none" stroke="#18181b" stroke-width="0.8" stroke-opacity="0.40"/>
        <text x="140" y="179" fill="#52525b" font-size="8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">2</text>
        <text x="160" y="173" fill="#18181b" font-size="12" font-weight="600" font-family="'Figtree', system-ui, sans-serif">Fill the template</text>
        <text x="160" y="188" fill="#52525b" font-size="9" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">Copier · new app folder</text>

        <!-- Step 3: Validate render.yaml -->
        <rect x="120" y="224" width="280" height="48" rx="6" fill="#fafafa"/>
        <rect x="120" y="224" width="280" height="48" rx="6" fill="#ffffff" stroke="#18181b" stroke-width="1"/>
        <rect x="132" y="240" width="16" height="16" rx="2" fill="none" stroke="#18181b" stroke-width="0.8" stroke-opacity="0.40"/>
        <text x="140" y="251" fill="#52525b" font-size="8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">3</text>
        <text x="160" y="245" fill="#18181b" font-size="12" font-weight="600" font-family="'Figtree', system-ui, sans-serif">Validate render.yaml</text>
        <text x="160" y="260" fill="#52525b" font-size="9" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">creates nothing on Render</text>

        <!-- Step 4: Create GitHub repo -->
        <rect x="120" y="296" width="280" height="48" rx="6" fill="#fafafa"/>
        <rect x="120" y="296" width="280" height="48" rx="6" fill="#ffffff" stroke="#18181b" stroke-width="1"/>
        <rect x="132" y="312" width="16" height="16" rx="2" fill="none" stroke="#18181b" stroke-width="0.8" stroke-opacity="0.40"/>
        <text x="140" y="323" fill="#52525b" font-size="8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">4</text>
        <text x="160" y="317" fill="#18181b" font-size="12" font-weight="600" font-family="'Figtree', system-ui, sans-serif">Create GitHub repo</text>
        <text x="160" y="332" fill="#52525b" font-size="9" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">private · skip: --no-github</text>

        <!-- Step 5: Print the result -->
        <rect x="120" y="368" width="280" height="48" rx="6" fill="#fafafa"/>
        <rect x="120" y="368" width="280" height="48" rx="6" fill="#ffffff" stroke="#18181b" stroke-width="1"/>
        <rect x="132" y="384" width="16" height="16" rx="2" fill="none" stroke="#18181b" stroke-width="0.8" stroke-opacity="0.40"/>
        <text x="140" y="395" fill="#52525b" font-size="8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">5</text>
        <text x="160" y="389" fill="#18181b" font-size="12" font-weight="600" font-family="'Figtree', system-ui, sans-serif">Print the result</text>
        <text x="160" y="404" fill="#52525b" font-size="9" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">Blueprint link · --json</text>

        <!-- Step 6: Apply the Blueprint (focal, accent) -->
        <rect x="560" y="368" width="280" height="48" rx="6" fill="#fafafa"/>
        <rect x="560" y="368" width="280" height="48" rx="6" fill="#4f46e5" stroke="#4f46e5" stroke-width="1.2" fill-opacity="0.08"/>
        <rect x="572" y="384" width="16" height="16" rx="2" fill="none" stroke="#4f46e5" stroke-width="0.8" stroke-opacity="0.50"/>
        <text x="580" y="395" fill="#4f46e5" font-size="8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">6</text>
        <text x="600" y="389" fill="#18181b" font-size="12" font-weight="600" font-family="'Figtree', system-ui, sans-serif">Apply the Blueprint</text>
        <text x="600" y="404" fill="#52525b" font-size="9" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">creates paid web service + Postgres</text>

        <!-- Step 7: Set Google settings -->
        <rect x="560" y="440" width="280" height="48" rx="6" fill="#fafafa"/>
        <rect x="560" y="440" width="280" height="48" rx="6" fill="#ffffff" stroke="#18181b" stroke-width="1"/>
        <rect x="572" y="456" width="16" height="16" rx="2" fill="none" stroke="#18181b" stroke-width="0.8" stroke-opacity="0.40"/>
        <text x="580" y="467" fill="#52525b" font-size="8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">7</text>
        <text x="600" y="461" fill="#18181b" font-size="12" font-weight="600" font-family="'Figtree', system-ui, sans-serif">Set Google settings</text>
        <text x="600" y="476" fill="#52525b" font-size="9" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">client ID, secret, allowed emails</text>

        <!-- Step 8: Sign in -->
        <rect x="560" y="512" width="280" height="48" rx="6" fill="#fafafa"/>
        <rect x="560" y="512" width="280" height="48" rx="6" fill="#ffffff" stroke="#18181b" stroke-width="1"/>
        <rect x="572" y="528" width="16" height="16" rx="2" fill="none" stroke="#18181b" stroke-width="0.8" stroke-opacity="0.40"/>
        <text x="580" y="539" fill="#52525b" font-size="8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">8</text>
        <text x="600" y="533" fill="#18181b" font-size="12" font-weight="600" font-family="'Figtree', system-ui, sans-serif">Sign in</text>
        <text x="600" y="548" fill="#52525b" font-size="9" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">app unlocks</text>

        <!-- Editorial callout -->
        <text x="700" y="316" fill="#18181b" font-size="14" font-style="italic" font-family="'Urbanist', system-ui, sans-serif" text-anchor="middle">Nothing costs money until you apply the Blueprint.</text>
        <path d="M 700,326 V 364" fill="none" stroke="#18181b" stroke-width="1" stroke-dasharray="4,3" stroke-opacity="0.40"/>
        <circle cx="700" cy="368" r="2" fill="#18181b"/>
      </svg>
