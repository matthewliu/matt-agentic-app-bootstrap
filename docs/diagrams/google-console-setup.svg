<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="google-console-setup-title google-console-setup-desc" id="google-console-setup-root">
        <title id="google-console-setup-title">Set up a Google OAuth client</title>
        <desc id="google-console-setup-desc">Swimlane of the operator steps to set up Google sign-in: apply the Render Blueprint, create and configure a web OAuth client in Google Cloud Console, copy its ID and secret into Render environment variables, and optionally create a second local-only client for work on your own computer.</desc>
        <defs>
      <style>#google-console-setup-root { --color-paper:   #fafafa;
      --color-ink:     #18181b;
      --color-muted:   #52525b;
      --color-accent:  #4f46e5;
      --font-sans:     'Figtree', system-ui, sans-serif;
      --font-title:    'Urbanist', system-ui, sans-serif;
      --font-mono:     ui-monospace, SFMono-Regular, Menlo, monospace; }
      #google-console-setup-root { font-family: var(--font-sans); color: var(--color-ink); }
      #google-console-setup-root .diagram-container { width: 100%; overflow-x: auto; }
      @media print {
#google-console-setup-root .diagram-container { overflow-x: visible; }
}</style>
          <marker id="google-console-setup-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#52525b"/></marker>
          <marker id="google-console-setup-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f46e5"/></marker>
          <marker id="google-console-setup-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2563eb"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#fafafa"/>

        <!-- LANES (vertical columns): Render 40-320, Google 320-640, Your computer 640-920 -->
        <line x1="40" y1="72" x2="920" y2="72" stroke="#18181b" stroke-width="1" stroke-opacity="0.22"/>
        <line x1="40" y1="528" x2="920" y2="528" stroke="#18181b" stroke-width="1" stroke-opacity="0.22"/>
        <line x1="320" y1="40" x2="320" y2="528" stroke="#18181b" stroke-width="1" stroke-opacity="0.10"/>
        <line x1="640" y1="40" x2="640" y2="528" stroke="#18181b" stroke-width="1" stroke-opacity="0.10"/>

        <text x="56" y="60" fill="#52525b" font-size="8" font-weight="500" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" letter-spacing="0.18em">RENDER DASHBOARD</text>
        <text x="336" y="60" fill="#52525b" font-size="8" font-weight="500" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" letter-spacing="0.18em">GOOGLE CLOUD CONSOLE</text>
        <text x="656" y="60" fill="#52525b" font-size="8" font-weight="500" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" letter-spacing="0.18em">YOUR COMPUTER</text>

        <!-- ARROWS (drawn before steps) -->
        <!-- 1 to 2: Render to Google -->
        <line x1="260" y1="112" x2="380" y2="112" stroke="#52525b" stroke-width="1.2" marker-end="url(#google-console-setup-arrow)"/>
        <!-- 2 to 3 to 4 to 5 to 6 to 7: down the Google column -->
        <line x1="480" y1="136" x2="480" y2="160" stroke="#52525b" stroke-width="1.2" marker-end="url(#google-console-setup-arrow)"/>
        <line x1="480" y1="208" x2="480" y2="232" stroke="#52525b" stroke-width="1.2" marker-end="url(#google-console-setup-arrow)"/>
        <line x1="480" y1="280" x2="480" y2="304" stroke="#52525b" stroke-width="1.2" marker-end="url(#google-console-setup-arrow)"/>
        <line x1="480" y1="352" x2="480" y2="376" stroke="#52525b" stroke-width="1.2" marker-end="url(#google-console-setup-arrow)"/>
        <line x1="480" y1="424" x2="480" y2="448" stroke="#52525b" stroke-width="1.2" marker-end="url(#google-console-setup-arrow)"/>
        <!-- 7 to 8: Google to Render -->
        <line x1="380" y1="472" x2="300" y2="472" stroke="#52525b" stroke-width="1.2" marker-end="url(#google-console-setup-arrow)"/>
        <!-- 5 to 9: local-only branch -->
        <line x1="580" y1="328" x2="660" y2="328" stroke="#52525b" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#google-console-setup-arrow)"/>

        <!-- ARROW LABELS -->
        <rect x="320" y="452" width="40" height="12" rx="2" fill="#fafafa"/>
        <text x="340" y="461" fill="#6b6b76" font-size="8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle" letter-spacing="0.06em">PASTE</text>

        <rect x="588" y="308" width="64" height="12" rx="2" fill="#fafafa"/>
        <text x="620" y="317" fill="#6b6b76" font-size="8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle" letter-spacing="0.06em">LOCAL WORK</text>

        <!-- STEPS -->
        <!-- 1 Render: Apply Blueprint -->
        <rect x="100" y="88" width="160" height="48" rx="6" fill="#fafafa"/>
        <rect x="100" y="88" width="160" height="48" rx="6" fill="#ffffff" stroke="#18181b" stroke-width="1"/>
        <rect x="108" y="94" width="16" height="12" rx="2" fill="none" stroke="#18181b" stroke-width="0.8" stroke-opacity="0.40"/>
        <text x="116" y="103" fill="#52525b" font-size="7" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">1</text>
        <text x="180" y="110" fill="#18181b" font-size="12" font-weight="600" font-family="'Figtree', system-ui, sans-serif" text-anchor="middle">Apply Blueprint</text>
        <text x="180" y="124" fill="#52525b" font-size="9" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">copy the service URL</text>

        <!-- 2 Google: Create a project -->
        <rect x="380" y="88" width="200" height="48" rx="6" fill="#fafafa"/>
        <rect x="380" y="88" width="200" height="48" rx="6" fill="#ffffff" stroke="#18181b" stroke-width="1"/>
        <rect x="388" y="94" width="16" height="12" rx="2" fill="none" stroke="#18181b" stroke-width="0.8" stroke-opacity="0.40"/>
        <text x="396" y="103" fill="#52525b" font-size="7" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">2</text>
        <text x="480" y="116" fill="#18181b" font-size="12" font-weight="600" font-family="'Figtree', system-ui, sans-serif" text-anchor="middle">Create a project</text>

        <!-- 3 Google: Branding -->
        <rect x="380" y="160" width="200" height="48" rx="6" fill="#fafafa"/>
        <rect x="380" y="160" width="200" height="48" rx="6" fill="#ffffff" stroke="#18181b" stroke-width="1"/>
        <rect x="388" y="166" width="16" height="12" rx="2" fill="none" stroke="#18181b" stroke-width="0.8" stroke-opacity="0.40"/>
        <text x="396" y="175" fill="#52525b" font-size="7" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">3</text>
        <text x="480" y="182" fill="#18181b" font-size="12" font-weight="600" font-family="'Figtree', system-ui, sans-serif" text-anchor="middle">Branding</text>
        <text x="480" y="196" fill="#52525b" font-size="9" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">app name · support email</text>

        <!-- 4 Google: Audience -->
        <rect x="380" y="232" width="200" height="48" rx="6" fill="#fafafa"/>
        <rect x="380" y="232" width="200" height="48" rx="6" fill="#ffffff" stroke="#18181b" stroke-width="1"/>
        <rect x="388" y="238" width="16" height="12" rx="2" fill="none" stroke="#18181b" stroke-width="0.8" stroke-opacity="0.40"/>
        <text x="396" y="247" fill="#52525b" font-size="7" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">4</text>
        <text x="480" y="254" fill="#18181b" font-size="12" font-weight="600" font-family="'Figtree', system-ui, sans-serif" text-anchor="middle">Audience: External</text>
        <text x="480" y="268" fill="#52525b" font-size="9" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">publish, or add test users</text>

        <!-- 5 Google: Create client -->
        <rect x="380" y="304" width="200" height="48" rx="6" fill="#fafafa"/>
        <rect x="380" y="304" width="200" height="48" rx="6" fill="#ffffff" stroke="#18181b" stroke-width="1"/>
        <rect x="388" y="310" width="16" height="12" rx="2" fill="none" stroke="#18181b" stroke-width="0.8" stroke-opacity="0.40"/>
        <text x="396" y="319" fill="#52525b" font-size="7" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">5</text>
        <text x="480" y="326" fill="#18181b" font-size="12" font-weight="600" font-family="'Figtree', system-ui, sans-serif" text-anchor="middle">Create client</text>
        <text x="480" y="340" fill="#52525b" font-size="9" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">type: Web application</text>

        <!-- 6 Google: Redirect URIs -->
        <rect x="380" y="376" width="200" height="48" rx="6" fill="#fafafa"/>
        <rect x="380" y="376" width="200" height="48" rx="6" fill="#ffffff" stroke="#18181b" stroke-width="1"/>
        <rect x="388" y="382" width="16" height="12" rx="2" fill="none" stroke="#18181b" stroke-width="0.8" stroke-opacity="0.40"/>
        <text x="396" y="391" fill="#52525b" font-size="7" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">6</text>
        <text x="480" y="398" fill="#18181b" font-size="12" font-weight="600" font-family="'Figtree', system-ui, sans-serif" text-anchor="middle">Redirect URIs</text>
        <text x="480" y="412" fill="#52525b" font-size="9" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">&lt;service URL&gt;/auth/callback</text>

        <!-- 7 Google: Copy ID + secret (focal) -->
        <rect x="380" y="448" width="200" height="48" rx="6" fill="#fafafa"/>
        <rect x="380" y="448" width="200" height="48" rx="6" fill="#4f46e5" stroke="#4f46e5" stroke-width="1.2" fill-opacity="0.08"/>
        <rect x="388" y="454" width="16" height="12" rx="2" fill="none" stroke="#4f46e5" stroke-width="0.8" stroke-opacity="0.50"/>
        <text x="396" y="463" fill="#4f46e5" font-size="7" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">7</text>
        <text x="480" y="470" fill="#18181b" font-size="12" font-weight="600" font-family="'Figtree', system-ui, sans-serif" text-anchor="middle">Copy ID + secret</text>
        <text x="480" y="484" fill="#4f46e5" font-size="9" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">the secret shows once</text>

        <!-- 8 Render: Set env vars -->
        <rect x="60" y="432" width="240" height="80" rx="6" fill="#fafafa"/>
        <rect x="60" y="432" width="240" height="80" rx="6" fill="#ffffff" stroke="#18181b" stroke-width="1"/>
        <rect x="68" y="438" width="16" height="12" rx="2" fill="none" stroke="#18181b" stroke-width="0.8" stroke-opacity="0.40"/>
        <text x="76" y="447" fill="#52525b" font-size="7" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">8</text>
        <text x="180" y="456" fill="#18181b" font-size="12" font-weight="600" font-family="'Figtree', system-ui, sans-serif" text-anchor="middle">Set env vars</text>
        <text x="180" y="472" fill="#52525b" font-size="9" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">GOOGLE_CLIENT_ID</text>
        <text x="180" y="484" fill="#52525b" font-size="9" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">GOOGLE_CLIENT_SECRET</text>
        <text x="180" y="496" fill="#52525b" font-size="9" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">AUTH_ALLOWED_EMAILS</text>

        <!-- 9 Your computer: Local client in .env (local-only, dashed) -->
        <rect x="660" y="296" width="240" height="64" rx="6" fill="#fafafa"/>
        <rect x="660" y="296" width="240" height="64" rx="6" fill="#18181b" stroke="#18181b" stroke-width="1" stroke-dasharray="4,3" fill-opacity="0.02" stroke-opacity="0.40"/>
        <rect x="668" y="302" width="16" height="12" rx="2" fill="none" stroke="#18181b" stroke-width="0.8" stroke-opacity="0.30"/>
        <text x="676" y="311" fill="#52525b" font-size="7" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">9</text>
        <text x="780" y="320" fill="#18181b" font-size="12" font-weight="600" font-family="'Figtree', system-ui, sans-serif" text-anchor="middle">Local client in .env</text>
        <text x="780" y="336" fill="#52525b" font-size="9" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">redirect:</text>
        <text x="780" y="348" fill="#52525b" font-size="9" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">http://localhost:8000/auth/callback</text>

        <!-- LEGEND -->
        <line x1="40" y1="548" x2="920" y2="548" stroke="#18181b" stroke-width="0.8" stroke-opacity="0.10"/>
        <text x="40" y="575" fill="#52525b" font-size="8" font-weight="500" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" letter-spacing="0.18em">LEGEND</text>

        <rect x="112" y="566" width="14" height="10" rx="2" fill="#ffffff" stroke="#18181b" stroke-width="1"/>
        <text x="132" y="575" fill="#52525b" font-size="9" font-family="'Figtree', system-ui, sans-serif">Step</text>

        <rect x="184" y="566" width="14" height="10" rx="2" fill="#4f46e5" stroke="#4f46e5" stroke-width="1" fill-opacity="0.08"/>
        <text x="204" y="575" fill="#52525b" font-size="9" font-family="'Figtree', system-ui, sans-serif">Key step</text>

        <rect x="276" y="566" width="14" height="10" rx="2" fill="#18181b" stroke="#18181b" stroke-width="1" stroke-dasharray="3,2" fill-opacity="0.02" stroke-opacity="0.40"/>
        <text x="296" y="575" fill="#52525b" font-size="9" font-family="'Figtree', system-ui, sans-serif">Local-only step</text>

        <line x1="400" y1="572" x2="428" y2="572" stroke="#52525b" stroke-width="1.2" marker-end="url(#google-console-setup-arrow)"/>
        <text x="436" y="575" fill="#52525b" font-size="9" font-family="'Figtree', system-ui, sans-serif">Next step</text>

        <line x1="516" y1="572" x2="544" y2="572" stroke="#52525b" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#google-console-setup-arrow)"/>
        <text x="552" y="575" fill="#52525b" font-size="9" font-family="'Figtree', system-ui, sans-serif">Second client, local only</text>
      </svg>
