<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="local-dev-setup-title local-dev-setup-desc" id="local-dev-setup-root">
        <title id="local-dev-setup-title">Run an app on your computer</title>
        <desc id="local-dev-setup-desc">On your computer the browser loads the Vite dev server, which forwards API and sign-in calls to FastAPI; FastAPI reads settings from the .env file, stores data in Postgres in Docker, and uses a local Google OAuth client for sign-in.</desc>
        <defs>
      <style>#local-dev-setup-root { --color-paper:   #fafafa;
      --color-ink:     #18181b;
      --color-muted:   #52525b;
      --color-accent:  #4f46e5;
      --font-sans:     'Figtree', system-ui, sans-serif;
      --font-title:    'Urbanist', system-ui, sans-serif;
      --font-mono:     ui-monospace, SFMono-Regular, Menlo, monospace; }
      #local-dev-setup-root { font-family: var(--font-sans); color: var(--color-ink); }
      #local-dev-setup-root .diagram-container { width: 100%; overflow-x: auto; }
      @media print {
#local-dev-setup-root .diagram-container { overflow-x: visible; }
}</style>
          <marker id="local-dev-setup-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#52525b"/></marker>
          <marker id="local-dev-setup-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f46e5"/></marker>
          <marker id="local-dev-setup-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2563eb"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#fafafa"/>

        <!-- Boundary: your computer -->
        <rect x="40" y="48" width="700" height="424" rx="8" fill="#18181b" stroke="#18181b" stroke-width="1" stroke-dasharray="4,4" fill-opacity="0.02" stroke-opacity="0.30"/>
        <rect x="52" y="52" width="88" height="12" rx="2" fill="#fafafa"/>
        <text x="96" y="61" fill="#6b6b76" font-size="7" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle" letter-spacing="0.14em">YOUR COMPUTER</text>

        <!-- Arrows (drawn before nodes) -->
        <!-- Browser → Vite -->
        <line x1="208" y1="256" x2="256" y2="256" stroke="#2563eb" stroke-width="1.2" marker-end="url(#local-dev-setup-arrow-link)"/>
        <!-- Vite → FastAPI -->
        <line x1="436" y1="256" x2="516" y2="256" stroke="#2563eb" stroke-width="1.2" marker-end="url(#local-dev-setup-arrow-link)"/>
        <!-- .env → FastAPI (settings, dashed) -->
        <line x1="616" y1="168" x2="616" y2="216" stroke="#52525b" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#local-dev-setup-arrow)"/>
        <!-- FastAPI → Postgres -->
        <line x1="616" y1="296" x2="616" y2="368" stroke="#52525b" stroke-width="1.2" marker-end="url(#local-dev-setup-arrow)"/>
        <!-- FastAPI → Google (sign-in, dashed) -->
        <line x1="716" y1="256" x2="800" y2="256" stroke="#2563eb" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#local-dev-setup-arrow-link)"/>

        <!-- Arrow labels -->
        <rect x="444" y="236" width="64" height="12" rx="2" fill="#fafafa"/>
        <text x="476" y="245" fill="#6b6b76" font-size="8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle" letter-spacing="0.06em">/API /AUTH</text>
        <rect x="624" y="186" width="56" height="12" rx="2" fill="#fafafa"/>
        <text x="652" y="195" fill="#6b6b76" font-size="8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle" letter-spacing="0.06em">SETTINGS</text>
        <rect x="624" y="326" width="28" height="12" rx="2" fill="#fafafa"/>
        <text x="638" y="335" fill="#6b6b76" font-size="8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle" letter-spacing="0.06em">SQL</text>
        <rect x="734" y="236" width="48" height="12" rx="2" fill="#fafafa"/>
        <text x="758" y="245" fill="#6b6b76" font-size="8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle" letter-spacing="0.06em">SIGN-IN</text>

        <!-- Browser -->
        <rect x="64" y="216" width="144" height="80" rx="6" fill="#fafafa"/>
        <rect x="64" y="216" width="144" height="80" rx="6" fill="#ffffff" stroke="#18181b" stroke-width="1"/>
        <rect x="72" y="224" width="44" height="12" rx="2" fill="none" stroke="#18181b" stroke-width="0.8" stroke-opacity="0.40"/>
        <text x="94" y="233" fill="#52525b" font-size="7" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle" letter-spacing="0.08em">CLIENT</text>
        <text x="136" y="262" fill="#18181b" font-size="12" font-weight="600" font-family="'Figtree', system-ui, sans-serif" text-anchor="middle">Browser</text>
        <text x="136" y="278" fill="#52525b" font-size="9" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">http://localhost:5173</text>

        <!-- Vite dev server -->
        <rect x="256" y="216" width="180" height="80" rx="6" fill="#fafafa"/>
        <rect x="256" y="216" width="180" height="80" rx="6" fill="#ffffff" stroke="#18181b" stroke-width="1"/>
        <rect x="264" y="224" width="28" height="12" rx="2" fill="none" stroke="#18181b" stroke-width="0.8" stroke-opacity="0.40"/>
        <text x="278" y="233" fill="#52525b" font-size="7" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle" letter-spacing="0.08em">WEB</text>
        <text x="346" y="258" fill="#18181b" font-size="12" font-weight="600" font-family="'Figtree', system-ui, sans-serif" text-anchor="middle">Vite dev server</text>
        <text x="346" y="273" fill="#52525b" font-size="9" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">pnpm -C frontend dev</text>
        <text x="346" y="285" fill="#52525b" font-size="9" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">:5173</text>

        <!-- FastAPI (focal) -->
        <rect x="516" y="216" width="200" height="80" rx="6" fill="#fafafa"/>
        <rect x="516" y="216" width="200" height="80" rx="6" fill="#4f46e5" stroke="#4f46e5" stroke-width="1.2" fill-opacity="0.08"/>
        <rect x="524" y="224" width="28" height="12" rx="2" fill="none" stroke="#4f46e5" stroke-width="0.8" stroke-opacity="0.50"/>
        <text x="538" y="233" fill="#4f46e5" font-size="7" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle" letter-spacing="0.08em">API</text>
        <text x="616" y="258" fill="#18181b" font-size="12" font-weight="600" font-family="'Figtree', system-ui, sans-serif" text-anchor="middle">FastAPI (uvicorn)</text>
        <text x="616" y="273" fill="#52525b" font-size="9" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">uvicorn app.main:app --reload</text>
        <text x="616" y="285" fill="#52525b" font-size="9" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">.venv · :8000</text>

        <!-- .env file (config, optional style) -->
        <rect x="516" y="88" width="200" height="80" rx="6" fill="#fafafa"/>
        <rect x="516" y="88" width="200" height="80" rx="6" fill="#18181b" stroke="#18181b" stroke-width="1" stroke-dasharray="4,3" fill-opacity="0.02" stroke-opacity="0.40"/>
        <rect x="524" y="96" width="44" height="12" rx="2" fill="none" stroke="#18181b" stroke-width="0.8" stroke-opacity="0.40"/>
        <text x="546" y="105" fill="#52525b" font-size="7" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle" letter-spacing="0.08em">CONFIG</text>
        <text x="616" y="130" fill="#18181b" font-size="12" font-weight="600" font-family="'Figtree', system-ui, sans-serif" text-anchor="middle">.env file</text>
        <text x="616" y="145" fill="#52525b" font-size="9" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">DATABASE_URL</text>
        <text x="616" y="157" fill="#52525b" font-size="9" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">Google local client</text>

        <!-- Postgres in Docker (store) -->
        <rect x="516" y="368" width="200" height="80" rx="6" fill="#fafafa"/>
        <rect x="516" y="368" width="200" height="80" rx="6" fill="#18181b" stroke="#52525b" stroke-width="1" fill-opacity="0.05"/>
        <rect x="524" y="376" width="24" height="12" rx="2" fill="none" stroke="#52525b" stroke-width="0.8" stroke-opacity="0.40"/>
        <text x="536" y="385" fill="#52525b" font-size="7" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle" letter-spacing="0.08em">DB</text>
        <text x="616" y="410" fill="#18181b" font-size="12" font-weight="600" font-family="'Figtree', system-ui, sans-serif" text-anchor="middle">Postgres in Docker</text>
        <text x="616" y="425" fill="#52525b" font-size="9" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">docker compose up -d db</text>
        <text x="616" y="437" fill="#52525b" font-size="9" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">:5432</text>

        <!-- Google (external, outside the boundary) -->
        <rect x="800" y="216" width="120" height="80" rx="6" fill="#fafafa"/>
        <rect x="800" y="216" width="120" height="80" rx="6" fill="#18181b" stroke="#18181b" stroke-width="1" fill-opacity="0.03" stroke-opacity="0.30"/>
        <rect x="808" y="224" width="28" height="12" rx="2" fill="none" stroke="#18181b" stroke-width="0.8" stroke-opacity="0.30"/>
        <text x="822" y="233" fill="#52525b" font-size="7" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle" letter-spacing="0.08em">EXT</text>
        <text x="860" y="262" fill="#18181b" font-size="12" font-weight="600" font-family="'Figtree', system-ui, sans-serif" text-anchor="middle">Google</text>
        <text x="860" y="278" fill="#52525b" font-size="9" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">local OAuth client</text>

        <!-- Callout: tests need no Postgres -->
        <path d="M 600,500 Q 616,496 616,452" fill="none" stroke="#18181b" stroke-width="1" stroke-dasharray="4,3" stroke-opacity="0.40"/>
        <circle cx="616" cy="450" r="2" fill="#18181b"/>
        <text x="592" y="508" fill="#18181b" font-size="14" font-style="italic" font-family="'Urbanist', system-ui, sans-serif" text-anchor="end">Tests use SQLite in memory, so pytest needs no Postgres.</text>

        <!-- Legend -->
        <line x1="40" y1="540" x2="920" y2="540" stroke="#18181b" stroke-width="0.8" stroke-opacity="0.10"/>
        <text x="40" y="556" fill="#52525b" font-size="8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" letter-spacing="0.14em">LEGEND</text>

        <rect x="40" y="572" width="24" height="12" rx="2" fill="#ffffff" stroke="#18181b" stroke-width="1"/>
        <text x="72" y="581" fill="#52525b" font-size="9" font-family="'Figtree', system-ui, sans-serif">Program you start</text>

        <rect x="176" y="572" width="24" height="12" rx="2" fill="#4f46e5" stroke="#4f46e5" stroke-width="1.2" fill-opacity="0.08"/>
        <text x="208" y="581" fill="#52525b" font-size="9" font-family="'Figtree', system-ui, sans-serif">App backend</text>

        <rect x="280" y="572" width="24" height="12" rx="2" fill="#18181b" stroke="#52525b" stroke-width="1" fill-opacity="0.05"/>
        <text x="312" y="581" fill="#52525b" font-size="9" font-family="'Figtree', system-ui, sans-serif">Database</text>

        <rect x="376" y="572" width="24" height="12" rx="2" fill="#18181b" stroke="#18181b" stroke-width="1" stroke-dasharray="4,3" fill-opacity="0.02" stroke-opacity="0.40"/>
        <text x="408" y="581" fill="#52525b" font-size="9" font-family="'Figtree', system-ui, sans-serif">Settings file</text>

        <rect x="496" y="572" width="24" height="12" rx="2" fill="#18181b" stroke="#18181b" stroke-width="1" fill-opacity="0.03" stroke-opacity="0.30"/>
        <text x="528" y="581" fill="#52525b" font-size="9" font-family="'Figtree', system-ui, sans-serif">Outside service</text>

        <line x1="624" y1="578" x2="652" y2="578" stroke="#2563eb" stroke-width="1.2" marker-end="url(#local-dev-setup-arrow-link)"/>
        <text x="660" y="581" fill="#52525b" font-size="9" font-family="'Figtree', system-ui, sans-serif">Web request</text>

        <line x1="736" y1="578" x2="764" y2="578" stroke="#52525b" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#local-dev-setup-arrow)"/>
        <text x="772" y="581" fill="#52525b" font-size="9" font-family="'Figtree', system-ui, sans-serif">Only at start or sign-in</text>
      </svg>
