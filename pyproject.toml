[project]
name = "agentic-core"
version = "0.1.0"
description = "Shared infrastructure, research, and templates for agentic mini-apps"
requires-python = ">=3.12"
dependencies = [
    # Bootstrap tooling (existing).
    "copier>=9.0.0",
    "requests>=2.31.0",
    "python-dotenv>=1.0.0",
    # Runtime deps of the `agentic-core` console script (R13).
    # Previously dev-only; promoted to main because the installed CLI imports
    # them at startup. Keep version bounds open — these are stable surfaces.
    "typer>=0.12",
    "pydantic>=2",
    # Upper bounds are deliberate: agentic_core/bootstrap/keystore.py imports
    # eth_keyfile's private `_scrypt_hash` and AES helpers. eth-keyfile 0.10
    # (pulled in by eth-account 0.14) changed them and every keystore test
    # fails with "'str' object has no attribute 'decode'". Lift the bounds
    # only together with a keystore change and a green keystore suite.
    "eth-account>=0.13,<0.14",
    "eth-keyfile>=0.8,<0.10",
    "httpx>=0.27",
    "rich>=13",
    "filelock>=3",
]

[project.scripts]
agentic-core = "agentic_core.cli:app"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "responses>=0.25.0",
    "aiosqlite>=0.20.0",
    "pyyaml>=6.0.0",
    "ruff>=0.4.0",
    # The template tests render the mini-app and import it IN-PROCESS
    # (tests/unit/test_template_middleware_actor_sub.py, tests/contract/), so
    # the GENERATED app's runtime deps have to be importable here too. These
    # were undeclared and the suite only passed on machines where they
    # happened to be installed for another reason — a fresh checkout or CI
    # runner got ModuleNotFoundError. Keep in sync with the template's
    # pyproject.toml.jinja `dependencies`.
    "fastapi>=0.115",
    "pydantic-settings>=2.0",
    "pyjwt[crypto]>=2.8",
    "cryptography>=42.0",
    "certifi",
    # tests/unit/test_template_cli_mcp_rendering.py imports the generated
    # app's MCP server in-process. Keep in sync with the template's `mcp` extra.
    "mcp>=2.3,<3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 100

# Pinned for the same reason as the generated app (see the template's
# pyproject.toml.jinja): relying on ruff's DEFAULT selection couples the
# build to whatever ruff version happens to be installed — the defaults
# grew in 0.16 and a green tree would go red on an unrelated upgrade.
[tool.ruff.lint]
select = ["E", "F", "B", "UP"]
ignore = [
    # FastAPI dependency injection is function calls in argument defaults.
    "B008",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
# Explicit package list — repo is flat-layout with sibling dirs
# (templates/, tests/) that look like packages to setuptools'
# auto-discovery but aren't. Only `agentic_core` ships as the importable
# package; `templates/` is a Copier source tree, not a Python module.
packages = ["agentic_core"]
